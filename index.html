<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>FoFBiomass</title>
    <style>
      @import "node_modules/ol/ol.css";
    </style>
    <style>
      html, body, #map-container {
        margin: 0;
        height: 100%;
        width: 100%;
        z-index: 1000;
        font-family: sans-serif;
        background-color: #ffffff;
      }

      #legend {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.9);
        padding: 6px;
        border: 6px solid #aaaaaa00;
        width: 400px;
      }

      #controls {
        position: absolute;
        bottom: 30px;
        right: 20px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.9);
        padding: 8px;
        width: 280px;
        max-height: 60vh;
        overflow-y: auto;
        overflow-x: hidden;
        border-radius: 6px;
        box-sizing: border-box;
      }

      #crop-checkboxes {
        margin-bottom: 8px;
        max-height: 320px;
        overflow-y: auto;
      }

      #crop-checkboxes label {
        font-size: 13px;
        white-space: nowrap;
      }

      .category {
        margin-bottom: 6px;
      }

      .category-header {
        font-weight: bold;
      }

      .category-note {
        font-weight: normal;
        font-style: italic;
        color: #999;
      }

      .category-items {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px 12px;
        margin: 2px 0 2px 20px;
      }

      #select-all-controls {
        margin-bottom: 8px;
      }

      .legacy-controls {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid #ccc;
        color: #999;
      }

      .legacy-controls label {
        color: #999;
      }

      #pyrolysis-extra {
        display: none;
        margin-top: 6px;
        padding-left: 8px;
      }

      #resolution-control {
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid #ccc;
        font-size: 13px;
      }

      #resolution-control label {
        font-weight: bold;
      }

      #resolution-control input[type="number"] {
        width: 60px;
      }

      #resolution-note {
        font-weight: normal;
        color: #777;
        font-size: 12px;
        margin-top: 2px;
      }

      .info-icon {
        cursor: help;
        color: #666;
        border: 1px solid #999;
        border-radius: 50%;
        width: 14px;
        height: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: normal;
        margin-left: 4px;
      }
    </style>
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="map-container"></div>

    <div id="legend">
      <div id="legend-title" style="font-weight:bold; margin-bottom:4px; font-size: 20px;"></div>
      <div id="legend-gradient" style="height:20px; margin:4px 0;"></div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span id="legend-min"></span>
        <span style="display:flex; align-items:center; gap:4px;">
          <button type="button" id="legend-max-reset" title="Reset to automatic scaling">&#8635;</button>
          <input type="number" id="legend-max-input" min="0" step="any" style="width:110px;" title="Enter a custom color bar max. Useful when the automatic power-of-10 scale is too high to show contrast in your area of interest.">
        </span>
      </div>
    </div>

    <div id="controls">
      <div id="resolution-control">
        <label for="resolution-value">
          Grid Resolution
          <span class="info-icon" title="Aggregates production/residue values into coarser grid cells before plotting, by summing the underlying 5 arc-min SPAM2020 pixels within each cell. Enter a value in arc-minutes or km. Minimum is 5 arc-min (~9.3 km) — the native SPAM2020 resolution, so you can't go finer. Maximum is 100 km, a practical upper limit for economically shipping biomass to a biorefinery. (km-to-degree conversion uses an equatorial approximation, so actual cell size drifts slightly at high latitudes.)">&#9432;</span>
        </label>
        <br>
        <input type="number" id="resolution-value" value="30" step="0.1" min="0">
        <select id="resolution-unit">
          <option value="arcmin">arc-min</option>
          <option value="km">km</option>
        </select>
        <button type="button" id="apply-resolution">Apply</button>
        <div id="resolution-note">Native: 5 arc-min (~9.3 km)</div>
      </div>
      <div id="select-all-controls">
        <button type="button" id="select-all-crops">Select all</button>
        <button type="button" id="select-no-crops">Select none</button>
      </div>
      <div id="crop-checkboxes"></div>

      <div class="legacy-controls">
        <select id="visualization" disabled>
          <option value="total-residue">Total Residue</option>
          <option value="total-production">Total Production</option>
        </select>
        <br>
        <label>
          <input type="checkbox" id="display-transportation" disabled>
          Display transportation range
        </label>
        <br>
        <label>
          <input type="checkbox" id="pyrolysis-options" disabled>
          Enable additional options
        </label>
        <div id="pyrolysis-extra">
          <label>
            Biochar usage:
            <select id="biochar-usage" disabled>
              <option value="storage">storage</option>
              <option value="electricity">electricity</option>
            </select>
          </label>
          <br>
          <label>
            Bio-oil usage:
            <select id="biooil-usage" disabled>
              <option value="transportation fuel">transportation fuel</option>
              <option value="storage">storage</option>
            </select>
          </label>
          <br>
          <label>
            <input type="checkbox" id="include-ccs" disabled>
            Use CCS
          </label>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>

    <div id="attribution-banner" style="
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 3000;
      font-family: sans-serif;
      font-size: 13px;
    ">
      <div id="attribution-expanded" style="
        display: none;
        background: white;
        border-top: 1px solid #cccccc;
        padding: 16px 20px;
        max-height: 300px;
        overflow-y: auto;
      ">
        <strong style="font-size: 15px;">About FoFBiomass</strong>
        <p style="margin: 8px 0; color: #555;">
          Crop production data is from the <a href="https://www.mapspam.info/data/" target="_blank">SPAM2020 V2r2</a> dataset (all technologies).
        </p>
      </div>
      <div id="attribution-bar" onclick="toggleAttribution()" style="
        background: white;
        border-top: 1px solid #cccccc;
        padding: 6px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        user-select: none;
      ">
        <span>FoFBiomass</span>
        <span id="attribution-arrow" style="font-size: 16px; transition: transform 0.2s;">&#9650;</span>
      </div>
    </div>

    <script>
      function toggleAttribution() {
        const expanded = document.getElementById('attribution-expanded');
        const arrow = document.getElementById('attribution-arrow');
        const isOpen = expanded.style.display === 'block';
        expanded.style.display = isOpen ? 'none' : 'block';
        arrow.style.transform = isOpen ? '' : 'rotate(180deg)';
      }
    </script>
  </body>
</html>
